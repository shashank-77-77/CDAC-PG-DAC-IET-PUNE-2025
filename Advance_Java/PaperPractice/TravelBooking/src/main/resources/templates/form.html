<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<div>
    <form th:action="@{/bookings/save}" th:object="${booking}" method="post">
        <input type="hidden" th:if="${booking.id}" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input class="form-control" th:field="*{customerName}" />
            <div class="text-danger" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" th:field="*{email}" />
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Source</label>
                <input class="form-control" th:field="*{source}" />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Destination</label>
                <input class="form-control" th:field="*{destination}" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Travel Date</label>
                <input type="date" class="form-control" th:field="*{travelDate}" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Seats</label>
                <input type="number" class="form-control" th:field="*{seats}" min="1" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Price</label>
                <input type="number" step="0.01" class="form-control" th:field="*{price}" />
            </div>
        </div>

        <div class="mt-3">
            <button class="btn btn-success" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/bookings}">Cancel</a>
        </div>
    </form>
</div>
</html>
